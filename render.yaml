databases:
  - name: seat-reservation-db
    databaseName: seats
    user: seats
    plan: free
    region: oregon
    postgresMajorVersion: "17"

services:
  - type: web
    name: seat-reservation-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seat-reservation-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: USER_TOKEN_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
