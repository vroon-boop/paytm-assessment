services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-password
      MYSQL_DATABASE: seats
      MYSQL_USER: seats
      MYSQL_PASSWORD: local-seats-password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal-root-password"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: seats
      DB_USER: seats
      DB_PASSWORD: local-seats-password
      ADMIN_TOKEN: local-admin-change-me
      USER_TOKEN_SECRET: local-user-secret-change-me
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql-data:
